<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Program projects</title>
  <style>
    :root { --bg:#fff; --fg:#1b1f24; --muted:#59636e; --line:#d1d9e0; --card:#f6f8fa; --link:#0b5cad; --bad:#b42318; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --line:#30363d; --card:#151b23; --link:#58a6ff; --bad:#ff7b72; } }
    body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
    main { max-width:56rem; margin:0 auto; padding:2rem 16px; }
    h1 { font-size:1.4rem; margin:0 0 1.25rem; }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:0.55rem 0.6rem; border-bottom:1px solid var(--line); vertical-align:top; }
    th { font-size:0.75rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); }
    a { color:var(--link); font-weight:600; }
    .muted { color:var(--muted); font-size:0.85rem; }
    .bad { color:var(--bad); font-size:0.85rem; }
    code { background:var(--card); padding:0 0.3em; border-radius:4px; }
  </style>
</head>
<body>
<main>
  <h1>Program projects</h1>
  <table>
    <thead><tr><th>Project</th><th>Role</th><th>Depends on</th><th>Mode</th><th>Sync</th></tr></thead>
    <tbody>
    {% for p in projects %}
      <tr>
        <td><a href="{{ projects_url() }}/{{ p.key }}/dashboard">{{ p.key }}</a></td>
        <td>{{ p.spec.role }}</td>
        <td>{{ p.spec.depends_on | join(', ') }}</td>
        <td>{{ p.spec.mode }}</td>
        <td>{% if p.error %}<span class="bad">{{ p.error }}</span>{% elif p.sha %}<code>{{ p.sha }}</code>{% else %}<span class="muted">not loaded yet</span>{% endif %}</td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
</main>
</body>
</html>
