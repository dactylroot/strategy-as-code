services:
  sample:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: strategy-docs
    ports:
      - "8765:8000"
    volumes:
      - ${PROJECT_SOURCE_PATH}:/project
      - ./app:/app/app
      - ./scripts:/app/scripts
    environment:
      PROJECT_DIR: /project
      SOURCE_PATH: ${PROJECT_SOURCE_PATH}
    restart: unless-stopped

  self:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: strategy-self
    ports:
      - "8766:8000"
    volumes:
      - ./self-project:/project
      - ./app:/app/app
      - ./scripts:/app/scripts
    environment:
      PROJECT_DIR: /project
      APP_TITLE: strategy-as-code (self)
    restart: unless-stopped
